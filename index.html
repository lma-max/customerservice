<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Ticket — CS Ticket Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎫</span>
        <span class="brand-text">CS Ticket Tracker</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">New Ticket</a>
        <a href="tickets.html" class="nav-link">All Tickets</a>
        <a href="documents.html" class="nav-link">Documents</a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="page-wrapper">
    <div class="page-header">
      <h1 class="page-title">Submit New Ticket</h1>
      <p class="page-subtitle">Fill in the details below to log a new customer inquiry.</p>
    </div>

    <!-- Flash message -->
    <div id="flash-message" class="alert alert-success" style="display:none;"></div>

    <div class="card">
      <form id="ticket-form" novalidate>

        <!-- Section: Ticket Info -->
        <div class="section-label">Ticket Info</div>
        <div class="form-grid">

          <div class="form-group">
            <label for="dateOfTicket">Date of Ticket <span class="required">*</span></label>
            <input type="date" id="dateOfTicket" name="dateOfTicket" required />
          </div>

          <div class="form-group">
            <label for="repName">CS Rep Name <span class="required">*</span></label>
            <input type="text" id="repName" name="repName" placeholder="Your name" required />
          </div>

          <div class="form-group">
            <label for="channel">Channel <span class="required">*</span></label>
            <select id="channel" name="channel" required>
              <option value="">— Select channel —</option>
              <option>GC Main</option>
              <option>GC Modern</option>
              <option>GC Vault</option>
              <option>GC Rips</option>
            </select>
          </div>

          <div class="form-group">
            <label for="customerUsername">Customer Username <span class="required">*</span></label>
            <input type="text" id="customerUsername" name="customerUsername" placeholder="e.g. johndoe92" required />
          </div>

        </div>

        <hr class="section-divider" />

        <!-- Section: Order Info -->
        <div class="section-label">Order Info</div>
        <div class="form-grid">

          <div class="form-group">
            <label for="orderNumber">Order # <span class="required">*</span></label>
            <input type="text" id="orderNumber" name="orderNumber" placeholder="e.g. 1234567" required />
          </div>

          <div class="form-group">
            <label for="orderDate">Order Date <span class="required">*</span></label>
            <input type="date" id="orderDate" name="orderDate" required />
          </div>

          <div class="form-group">
            <label for="issueCategory">Issue Category <span class="required">*</span></label>
            <select id="issueCategory" name="issueCategory" required>
              <option value="">— Select category —</option>
              <option>Shipping Issue</option>
              <option>Wrong Item</option>
              <option>Missing Item</option>
              <option>Damaged Item</option>
              <option>Return Request</option>
              <option>Cancelled Order</option>
              <option>Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="responseStatus">Response Status <span class="required">*</span></label>
            <select id="responseStatus" name="responseStatus" required>
              <option value="">— Select status —</option>
              <option>Open</option>
              <option>In Progress</option>
              <option>Pending Customer</option>
              <option>Resolved</option>
              <option>Closed</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="issue">Issue <span class="required">*</span></label>
            <textarea id="issue" name="issue" placeholder="Briefly describe the issue..." required></textarea>
          </div>

        </div>

        <hr class="section-divider" />

        <!-- Section: Resolution -->
        <div class="section-label">Resolution & Follow-Up</div>
        <div class="form-grid">

          <div class="form-group">
            <label for="lastContacted">Last Contacted <span class="required">*</span></label>
            <input type="date" id="lastContacted" name="lastContacted" required />
          </div>

          <div class="form-group">
            <label for="resolutionType">Resolution Type</label>
            <select id="resolutionType" name="resolutionType">
              <option value="">— Select if resolved —</option>
              <option>Refund</option>
              <option>Replacement</option>
              <option>Cancelled Order</option>
              <option>No Action Needed</option>
              <option>Other</option>
            </select>
            <span class="form-hint">Optional — fill in when resolved.</span>
          </div>

          <div class="form-group">
            <label for="totalResolutionTime">Total Resolution Time</label>
            <input type="text" id="totalResolutionTime" name="totalResolutionTime" placeholder='e.g. "3 days", "1 week"' />
            <span class="form-hint">Optional — fill in when resolved.</span>
          </div>

          <div class="form-group full-width">
            <label for="notes">Notes <span class="required">*</span></label>
            <textarea id="notes" name="notes" rows="4"
              placeholder="Add a dated note, e.g. '03/02/2026 — Customer replied, awaiting return label'" required></textarea>
            <span class="form-hint">Always add new entries at the top with today's date.</span>
          </div>

        </div>

        <hr class="section-divider" />

        <div style="display:flex; gap:12px; justify-content:flex-end;">
          <button type="button" class="btn btn-secondary" id="clear-btn">Clear Form</button>
          <button type="submit" class="btn btn-primary">
            &#10003; Submit Ticket
          </button>
        </div>

      </form>
    </div>
  </div><!-- end page-wrapper -->

  <script src="app.js"></script>
  <script>
    const form = document.getElementById('ticket-form');
    const flash = document.getElementById('flash-message');
    const clearBtn = document.getElementById('clear-btn');

    // Set default dates to today
    (function setDefaults() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateOfTicket').value = today;
      document.getElementById('lastContacted').value = today;
    })();

    function showFlash(msg, type = 'success') {
      flash.className = `alert alert-${type}`;
      flash.textContent = msg;
      flash.style.display = 'flex';
      flash.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (type === 'success') {
        setTimeout(() => { flash.style.display = 'none'; }, 6000);
      }
    }

    function getFormData() {
      const data = {};
      const fields = [
        'dateOfTicket','repName','channel','customerUsername',
        'orderNumber','orderDate','issueCategory','issue',
        'responseStatus','lastContacted','resolutionType',
        'notes','totalResolutionTime'
      ];
      fields.forEach(f => {
        data[f] = document.getElementById(f).value.trim();
      });
      return data;
    }

    function validateForm(data) {
      const required = [
        'dateOfTicket','repName','channel','customerUsername',
        'orderNumber','orderDate','issueCategory','issue',
        'responseStatus','lastContacted','notes'
      ];
      for (const field of required) {
        if (!data[field]) {
          const label = document.querySelector(`label[for="${field}"]`);
          const labelText = label ? label.textContent.replace('*','').trim() : field;
          return `"${labelText}" is required.`;
        }
      }
      return null;
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const data = getFormData();
      const error = validateForm(data);
      if (error) {
        showFlash(error, 'error');
        return;
      }
      const ticket = addTicket(data);
      showFlash(`Ticket ${ticket.id} submitted successfully! The form has been cleared.`, 'success');
      form.reset();
      // Re-set default dates
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateOfTicket').value = today;
      document.getElementById('lastContacted').value = today;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    clearBtn.addEventListener('click', function() {
      if (confirm('Clear all fields and start over?')) {
        form.reset();
        flash.style.display = 'none';
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateOfTicket').value = today;
        document.getElementById('lastContacted').value = today;
      }
    });
  </script>

</body>
</html>
